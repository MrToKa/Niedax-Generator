services:
  postgres:
    image: postgres:18.6-alpine3.23@sha256:885cf05d376c7cf27afef02073e6bdac3841252537f16e244fd1c1e6a7c99fb1
    environment:
      POSTGRES_DB: niedax_generator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    secrets: &all-secrets
      - postgres_admin_password
      - postgres_app_password
      - postgres_migrator_password
      - postgres_backup_password
    volumes:
      - ../scripts/initialize.sh:/docker-entrypoint-initdb.d/010-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d niedax_generator"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [database]

  migrations:
    build:
      context: ../..
      dockerfile: database/Dockerfile.migrations
    environment:
      PGHOST: postgres
      PGDATABASE: niedax_generator
      PGUSER: niedax_generator_migrator
      PGPASSWORD_FILE: /run/secrets/postgres_migrator_password
    secrets:
      - postgres_migrator_password
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database]

  backup:
    build:
      context: ../..
      dockerfile: database/Dockerfile.backup
    environment:
      PGHOST: postgres
      PGDATABASE: niedax_generator
      PGSSLMODE: disable
    secrets:
      - postgres_backup_password
      - postgres_migrator_password
    volumes:
      - ${BACKUP_TEST_DIRECTORY:?set BACKUP_TEST_DIRECTORY}:/backups
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks: [database]

networks:
  database:
    internal: true

secrets:
  postgres_admin_password:
    file: ${BACKUP_TEST_SECRETS:?set BACKUP_TEST_SECRETS}/postgres_admin_password
  postgres_app_password:
    file: ${BACKUP_TEST_SECRETS:?set BACKUP_TEST_SECRETS}/postgres_app_password
  postgres_migrator_password:
    file: ${BACKUP_TEST_SECRETS:?set BACKUP_TEST_SECRETS}/postgres_migrator_password
  postgres_backup_password:
    file: ${BACKUP_TEST_SECRETS:?set BACKUP_TEST_SECRETS}/postgres_backup_password
