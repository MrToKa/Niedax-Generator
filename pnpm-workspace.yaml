packages:
  - apps/*
  - packages/*
  - database
  - rules

injectWorkspacePackages: true
preferWorkspacePackages: true
saveExact: true
strictPeerDependencies: true

# ExcelJS only calls the CommonJS v4() API. Keep this security replacement scoped
# to that consumer; Stage 10 verifies v4 compatibility and independent OOXML goldens.
overrides:
  exceljs@4.4.0>uuid: 11.1.1
  # Compatible security patches only. Preserve each transitive consumer's major
  # line; audit gates remain unfiltered and the final lockfile is frozen in CI.
  "ip-address@<=10.7.0": 10.7.1
  "fast-uri@>=3.0.0 <3.1.8": 3.1.8
  "fast-uri@>=4.0.0 <4.1.5": 4.1.5
  "brace-expansion@>=1.0.0 <1.1.21": 1.1.21
  "brace-expansion@>=2.0.0 <2.1.7": 2.1.7
  "brace-expansion@>=5.0.0 <5.0.12": 5.0.12

syncInjectedDepsAfterScripts:
  - build

allowBuilds:
  esbuild: true
  unrs-resolver: true

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - next@16.3.0
  - react@19.2.8
  - react-dom@19.2.8
  - fastify@5.11.3
  - pg@8.23.0
  - typescript@6.0.3
  - vitest@4.1.10
  - pnpm@11.21.0
