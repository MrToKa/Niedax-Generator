packages:
  - apps/*
  - packages/*
  - database
  - rules

injectWorkspacePackages: true
preferWorkspacePackages: true
saveExact: true
strictPeerDependencies: true

# ExcelJS only calls the CommonJS v4() API. Keep this security replacement scoped
# to that consumer; Stage 10 verifies v4 compatibility and independent OOXML goldens.
overrides:
  exceljs@4.4.0>uuid: 11.1.1

syncInjectedDepsAfterScripts:
  - build

allowBuilds:
  esbuild: true
  unrs-resolver: true

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - next@16.3.0
  - react@19.2.8
  - react-dom@19.2.8
  - fastify@5.11.3
  - pg@8.23.0
  - typescript@6.0.3
  - vitest@4.1.10
  - pnpm@11.21.0
